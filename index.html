<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Test Deploy 🚀</title>
  <style>
    /* ─── Reset & Base ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: #0f0c29;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      overflow-x: hidden;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ─── Animated Background Stars ────────────────────────── */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .stars span {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d, 3s) infinite alternate ease-in-out;
      opacity: 0;
    }
    @keyframes twinkle {
      0%   { opacity: 0; transform: scale(0.8); }
      100% { opacity: 0.8; transform: scale(1.2); }
    }

    /* ─── Floating Orbs ─────────────────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
      z-index: 0;
    }
    .orb-1 { width: 400px; height: 400px; background: #667eea; top: -100px; left: -100px; }
    .orb-2 { width: 350px; height: 350px; background: #f093fb; bottom: -80px; right: -80px; animation-delay: -6s; }
    .orb-3 { width: 250px; height: 250px; background: #4facfe; top: 40%; left: 20%; animation-delay: -3s; }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    /* ─── Main Container ─────────────────────────────────────── */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      padding: 24px;
    }

    /* ─── Card ───────────────────────────────────────────────── */
    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 52px 44px 44px;
      text-align: center;
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255,255,255,0.2);
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ─── Rocket Icon ────────────────────────────────────────── */
    .rocket-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #667eea, #f093fb);
      border-radius: 50%;
      font-size: 42px;
      margin-bottom: 28px;
      box-shadow: 0 12px 40px rgba(102, 126, 234, 0.5);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    /* ─── Typography ─────────────────────────────────────────── */
    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #a78bfa, #f0abfc, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1rem;
      color: rgba(255,255,255,0.65);
      margin-bottom: 36px;
      line-height: 1.6;
    }

    /* ─── Status Badge ───────────────────────────────────────── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.35);
      color: #4ade80;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 36px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6); }
      50%       { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
    }

    /* ─── Stats Row ──────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 36px;
    }
    .stat-item {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px 8px;
      transition: background 0.2s;
    }
    .stat-item:hover { background: rgba(255,255,255,0.12); }
    .stat-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
    }
    .stat-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 4px;
    }

    /* ─── Button ─────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 30px rgba(102, 126, 234, 0.45);
      position: relative;
      overflow: hidden;
      width: 100%;
      justify-content: center;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      border-radius: inherit;
    }
    .btn:hover  { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(102, 126, 234, 0.6); }
    .btn:active { transform: translateY(0);    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4); }

    /* ─── Footer ─────────────────────────────────────────────── */
    .footer {
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.35);
    }
    .footer a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer a:hover { color: #a78bfa; }
    .sep { opacity: 0.4; }
  </style>
</head>
<body>

  <!-- Floating orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Twinkling stars -->
  <div class="stars" id="stars"></div>

  <!-- Main content -->
  <div class="container">
    <div class="card">

      <div class="rocket-wrap">🚀</div>

      <h1>Antigravity&nbsp;Live!</h1>
      <p class="subtitle">
        Pehla Netlify deploy successfully complete ho gaya.<br>
        Everything is up &amp; running smoothly.
      </p>

      <div class="status-badge">
        <span class="status-dot"></span>
        DEPLOYED &amp; LIVE
      </div>

      <div class="stats">
        <div class="stat-item">
          <div class="stat-value">✓</div>
          <div class="stat-label">Build</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">100%</div>
          <div class="stat-label">Uptime</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">v1.0</div>
          <div class="stat-label">Version</div>
        </div>
      </div>

      <button class="btn" onclick="handleTest(this)">
        <span>⚡</span> Run Test
      </button>

    </div>

    <div class="footer">
      <span>Selsla Technology</span>
      <span class="sep">·</span>
      <span>Deployed 14 Oct 2026</span>
      <span class="sep">·</span>
      <a href="#" onclick="return false;">Netlify</a>
    </div>
  </div>

  <script>
    /* ── Generate twinkling stars ── */
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('span');
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = `
        width:${size}px; height:${size}px;
        top:${Math.random()*100}%; left:${Math.random()*100}%;
        --d:${(Math.random()*4+1.5).toFixed(1)}s;
        animation-delay:${(Math.random()*5).toFixed(1)}s;
      `;
      starsEl.appendChild(s);
    }

    /* ── Button handler ── */
    function handleTest(btn) {
      btn.textContent = '✅ Working!';
      btn.style.background = 'linear-gradient(135deg, #059669, #10b981)';
      setTimeout(() => {
        btn.innerHTML = '<span>⚡</span> Run Test';
        btn.style.background = '';
      }, 2000);
    }
  </script>
</body>
</html>
